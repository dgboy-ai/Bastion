[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bastion-memory"
version = "0.10.0"
description = "Crash-proof memory for AI agents on CockroachDB"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1,<4",
    "asyncpg>=0.29,<1",
    "httpx>=0.27,<1",
    "anyio>=4.0,<5",
    "boto3>=1.34,<2",
    "structlog>=24.1,<25",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.0,<3",
    "anyio>=4.0,<5",
]
otel = [
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
]
mcp = [
    "mcp>=1.0,<2",
]
langchain = [
    "langchain>=0.3,<1",
]
crewai = [
    "crewai>=0.100,<1",
]
llamaindex = [
    "llama-index>=0.12,<1",
]
a2a = [
    "a2a-sdk>=1.1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.0,<3",
    "anyio>=4.0,<5",
]
kms = [
    "cryptography>=42.0,<43",
    "google-cloud-kms>=2.20,<3",
]
bridge = []
groq = [
    "groq>=0.12,<1",
]
all = [
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "mcp>=1.0,<2",
    "langchain>=0.3,<1",
    "crewai>=0.100,<1",
    "llama-index>=0.12,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.0,<3",
    "anyio>=4.0,<5",
    "cryptography>=42.0,<43",
    "google-cloud-kms>=2.20,<3",
    "groq>=0.12,<1",
    "a2a-sdk>=1.1.0,<2",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ASYNC", "B", "SIM", "TID", "RUF100"]
ignore = [
    "B904",  # raise-within-try — not always applicable
    "SIM108", # use-if-expression — readability > brevity
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
    "e2e: marks tests that need a live server (select with --e2e)",
    "integration: marks tests that need a real CockroachDB (select with --integration)",
    "stress: marks potentially slow stress tests (select with --stress)",
    "property: marks property-based tests (select with --property)",
]

[tool.coverage.run]
source = ["bastion"]
omit = ["tests/*", "scripts/*", "lambda/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.pyrefly]
# Point Pyrefly at the conda environment where all packages are installed.
# Without this it defaults to the Microsoft Store Python 3.13 and cannot
# find mcp, dotenv, sentence_transformers, etc.
python-interpreter = "C:\\Users\\Trueb\\miniconda3\\python.exe"
# Exclude Pyrefly's own virtual in-memory analysis buffers from diagnostics.
# These synthetic files (e.g. _pyrefly_virtual_\inmemory\*.py) are created by
# Pyrefly internally and generate false-positive parse errors.
exclude = ["**/_pyrefly_virtual_/**"]
