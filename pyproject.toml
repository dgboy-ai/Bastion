[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bastion-memory"
version = "0.1.0"
description = "Crash-proof memory for AI agents on CockroachDB"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.0",
    "anyio>=4.0",
]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]
mcp = [
    "mcp>=1.0",
]
langchain = [
    "langchain>=0.3",
]
crewai = [
    "crewai>=0.100",
]
llamaindex = [
    "llama-index>=0.12",
]
a2a = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.0",
    "anyio>=4.0",
]
kms = [
    "cryptography>=42.0",
    "google-cloud-kms>=2.20",
]
bridge = []
all = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "mcp>=1.0",
    "langchain>=0.3",
    "crewai>=0.100",
    "llama-index>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.0",
    "anyio>=4.0",
    "cryptography>=42.0",
    "google-cloud-kms>=2.20",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ASYNC", "B", "SIM", "TID", "RUF100"]
ignore = [
    "B904",  # raise-within-try — not always applicable
    "SIM108", # use-if-expression — readability > brevity
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
