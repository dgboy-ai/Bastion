# Bastion — Demo Stack (Simplified for Hackathon Judges)
# One command: docker compose -f docker-compose.demo.yml up
#
# This spins up:
# - CockroachDB (single-node, INSECURE mode for demo)
# - Bastion Dashboard (Next.js at localhost:3000)
# - Pre-seeded demo agent with sample memories
#
# For production, use docker-compose.yml with TLS.

services:
  cockroachdb:
    image: cockroachdb/cockroach:v24.3
    command: start-single-node --insecure --accept-payloads-for-urls=/
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    networks:
      - bastion-net

  schema-init:
    image: cockroachdb/cockroach:v24.3
    depends_on:
      cockroachdb:
        condition: service_healthy
    volumes:
      - ./schema:/schemas:ro
    entrypoint: >
      sh -c "
        echo 'Applying schemas...'
        for f in /schemas/0*.sql; do
          echo \"  -> \$(basename \$f)\"
          cockroach sql --insecure --host=cockroachdb -f \"\$f\" || { echo 'SCHEMA FAILED'; exit 1; }
        done
        echo 'Schemas applied successfully!'
      "
    networks:
      - bastion-net

  seed-data:
    image: python:3.12-slim
    depends_on:
      schema-init:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/scripts:ro
      - ./src:/app/src:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    working_dir: /app
    environment:
      - BASTION_CONN=postgresql://root@cockroachdb:26257/defaultdb?sslmode=disable
    entrypoint: >
      sh -c "
        echo 'Installing dependencies...'
        pip install psycopg[binary] pydantic pydantic-settings structlog httpx anyio --quiet 2>/dev/null
        pip install -e /app --quiet 2>/dev/null
        echo 'Seeding demo data...'
        python /scripts/seed_demo.py
        echo 'Seeding complete!'
      "
    networks:
      - bastion-net

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BASTION_CONN=postgresql://root@cockroachdb:26257/defaultdb?sslmode=disable
      - BASTION_MOCK=false
      - BASTION_API_KEY=${BASTION_API_KEY:-bastion-demo-key-2026}
    depends_on:
      cockroachdb:
        condition: service_healthy
      seed-data:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - bastion-net

  # ── MCP Server (Agent Tool Interface) ────────────────────────────────
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "9997:9997"
    environment:
      - BASTION_CONN=postgresql://root@cockroachdb:26257/defaultdb?sslmode=disable
      - BASTION_MOCK=false
    depends_on:
      cockroachdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9997/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - bastion-net

  # ── A2A Server (Agent-to-Agent Protocol) ────────────────────────────
  a2a-server:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "9998:9998"
    environment:
      - BASTION_CONN=postgresql://root@cockroachdb:26257/defaultdb?sslmode=disable
      - BASTION_MOCK=false
      - BASTION_API_KEY=${BASTION_API_KEY:-bastion-demo-key-2026}
    depends_on:
      cockroachdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9998/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - bastion-net

volumes:
  cockroach-data:

networks:
  bastion-net:
    driver: bridge
