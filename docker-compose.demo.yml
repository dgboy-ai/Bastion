# Bastion — Demo Stack (Simplified for Hackathon Judges)
# One command: docker compose -f docker-compose.demo.yml up
#
# This spins up:
# - CockroachDB (single-node, INSECURE mode for demo)
# - Bastion Dashboard (Next.js at localhost:3000)
# - Pre-seeded demo agent with sample memories
#
# For production, use docker-compose.yml with TLS.

services:
  cockroachdb:
    image: cockroachdb/cockroach:latest
    command: start-single-node --insecure --accept-payloads-for-urls=/
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    networks:
      - bastion-net

  schema-init:
    image: cockroachdb/cockroach:latest
    depends_on:
      cockroachdb:
        condition: service_healthy
    volumes:
      - ./schema:/schemas:ro
    entrypoint: >
      sh -c "
        echo 'Applying schemas...'
        for f in /schemas/0*.sql; do
          cockroach sql --insecure --host=cockroachdb -f \"\$f\" 2>&1 || true
        done
        echo 'Schemas applied!'
      "
    networks:
      - bastion-net

  seed-data:
    image: python:3.12-slim
    depends_on:
      schema-init:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/scripts:ro
      - ./src:/app/src:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    working_dir: /app
    environment:
      - BASTION_CONN=postgresql://root@cockroachdb:26257/defaultdb?sslmode=disable
    entrypoint: >
      sh -c "
        echo 'Installing dependencies...'
        pip install psycopg[binary] --quiet 2>/dev/null
        echo 'Seeding demo data...'
        python /scripts/seed_graph.py
        echo 'Seeding complete!'
      "
    networks:
      - bastion-net

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BASTION_CONN=postgresql://root@cockroachdb:26257/defaultdb?sslmode=disable
      - BASTION_MOCK=false
    depends_on:
      cockroachdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bastion-net

volumes:
  cockroach-data:

networks:
  bastion-net:
    driver: bridge
