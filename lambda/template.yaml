AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Bastion CDC Handler and Webhook Dispatcher Lambda functions.
  Consumes CockroachDB changefeed events and delivers push notifications.

Parameters:
  BastionConn:
    Type: String
    Description: CockroachDB connection string
    NoEcho: true
  SlackWebhookUrl:
    Type: String
    Description: Slack webhook URL for alerts (optional)
    Default: ""
  BastionHmacSecret:
    Type: String
    Description: HMAC secret for hash chain verification (must match bastion.crypto)
    NoEcho: true
    Default: ""

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        BASTION_CONN: !Ref BastionConn
        BASTION_HMAC_SECRET: !Ref BastionHmacSecret
        SLACK_WEBHOOK_URL: !Ref SlackWebhookUrl

Resources:
  # CDC Handler - polls for anomalies and processes changefeed events
  # Uses lambda/cdc_handler.py (flat module) — NOT lambda/cdc_handler/handler.py
  CDCHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: cdc_handler.handler
      CodeUri: .
      Description: Bastion CDC anomaly detector and self-healer
      Events:
        ScheduledPoll:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"mode": "poll"}'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"

  # Webhook Dispatcher - delivers push notifications to registered callbacks
  # Uses lambda/webhook_dispatcher.py (flat module) — NOT lambda/webhook_dispatcher/handler.py
  WebhookDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: webhook_dispatcher.handler
      CodeUri: .
      Description: Bastion A2A push notification dispatcher
      Events:
        ScheduledDispatch:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Input: '{"mode": "dispatch"}'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"

  # CloudWatch Alarms
  CDCHandlerErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CDC Handler errors exceed threshold
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      AlarmActions:
        - !Ref AlertSNSTopic
      Dimensions:
        - Name: FunctionName
          Value: !Ref CDCHandlerFunction

  AlertSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: bastion-alerts

Outputs:
  CDCHandlerArn:
    Description: CDC Handler Lambda ARN
    Value: !GetAtt CDCHandlerFunction.Arn
  WebhookDispatcherArn:
    Description: Webhook Dispatcher Lambda ARN
    Value: !GetAtt WebhookDispatcherFunction.Arn
  AlertTopicArn:
    Description: Alert SNS Topic ARN
    Value: !Ref AlertSNSTopic
