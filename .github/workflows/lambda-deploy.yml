name: Deploy Lambda Stack

on:
  push:
    branches: [main]
    paths:
      - "lambda/**"
      - ".github/workflows/lambda-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: SAM Build
        working-directory: lambda
        run: sam build --template template.yaml

      - name: SAM Deploy
        working-directory: lambda
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name bastion-lambda \
            --capabilities CAPABILITY_IAM \
            --region ${{ vars.AWS_REGION || 'ap-south-1' }} \
            --parameter-overrides \
              BastionConn="${{ secrets.BASTION_CONN }}" \
              BastionAlertTopic="${{ secrets.BASTION_ALERT_TOPIC || '' }}" \
              BastionS3Bucket="${{ vars.BASTION_S3_BUCKET || 'bastion-memory-archives' }}"
