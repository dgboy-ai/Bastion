name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -e ".[dev,all]" --upgrade pip
      - name: Lint with ruff
        run: ruff check .
        working-directory: src

  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -e ".[dev,all]" pytest-xdist --upgrade pip
      - name: Run tests (parallel)
        run: pytest -xvs --tb=short -n auto
        env:
          BASTION_MOCK: "true"

  dashboard-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: dashboard
      - name: Lint with ESLint
        run: npm run lint
        working-directory: dashboard
      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: dashboard
        continue-on-error: true

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: dashboard
      - name: Lint with ESLint
        run: npm run lint
        working-directory: dashboard
      - name: Build dashboard
        run: npm run build
        working-directory: dashboard

  dashboard-vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: dashboard
      - name: Run vitest
        run: npx vitest run --reporter=verbose
        working-directory: dashboard

  # ── Real CRDB Integration Tests ────────────────────────────────────────
  # This job runs a subset of tests against a real CockroachDB container
  # to prove our SQL queries, vector search, and time-travel actually work.
  crdb-integration:
    runs-on: ubuntu-latest
    services:
      cockroachdb:
        image: cockroachdb/cockroach:v24.2.0
        ports:
          - 26257:26257
        options: >-
          --health-cmd "cockroach node status --insecure --host=localhost:26257 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          COCKROACH_DB: defaultdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev,all]" --upgrade pip
      - name: Wait for CockroachDB
        run: |
          for i in $(seq 1 30); do
            if python -c "import psycopg; psycopg.connect('postgresql://root:@localhost:26257/defaultdb?sslmode=disable').close(); print('Connected!')" 2>/dev/null; then
              echo "CockroachDB is ready"
              break
            fi
            echo "Waiting for CockroachDB... ($i/30)"
            sleep 2
          done
      - name: Apply schema
        run: |
          python -c "
          import psycopg
          conn = psycopg.connect('postgresql://root:@localhost:26257/defaultdb?sslmode=disable')
          conn.autocommit = True
          cur = conn.cursor()
          cur.execute(open('schema/002_agent_memory.sql').read())
          cur.execute(open('schema/003_agent_audit.sql').read())
          cur.execute(open('schema/004_agent_coordination.sql').read())
          print('Schema applied successfully')
          conn.close()
          "
      - name: Run real CRDB integration tests
        run: pytest tests/test_crdb_integration.py -v --tb=short
        env:
          BASTION_CONN: "postgresql://root:@localhost:26257/defaultdb?sslmode=disable"
