name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -e ".[dev,all]" --upgrade pip
      - name: Lint with ruff
        run: ruff check .
        working-directory: src

  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -e ".[dev,all]" pytest-xdist --upgrade pip
      - name: Run tests (parallel)
        run: pytest -xvs --tb=short -n auto
        env:
          BASTION_MOCK: "true"

  dashboard-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: dashboard
      - name: Lint with ESLint
        run: npm run lint
        working-directory: dashboard
      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: dashboard
        continue-on-error: true

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: dashboard
      - name: Lint with ESLint
        run: npm run lint
        working-directory: dashboard
      - name: Build dashboard
        run: npm run build
        working-directory: dashboard

  dashboard-vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: dashboard
      - name: Run vitest
        run: npx vitest run --reporter=verbose
        working-directory: dashboard

  # ── Real CRDB Integration Tests ────────────────────────────────────────
  # Uses docker-compose to run CockroachDB in single-node insecure mode.
  crdb-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev,all]" --upgrade pip
      - name: Start CockroachDB via Docker
        run: |
          docker run -d --name crdb \
            -p 26257:26257 \
            cockroachdb/cockroach:v24.1.0 \
            start-single-node --insecure --accept-licenses
          echo "Waiting for CockroachDB SQL interface..."
          for i in $(seq 1 90); do
            if docker exec crdb cockroach sql --insecure -e "SELECT 1" 2>/dev/null; then
              echo "CockroachDB SQL ready after ${i}s"
              break
            fi
            echo "Waiting for SQL... ($i/90)"
            sleep 2
          done
      - name: Create database and apply schema
        run: |
          docker exec crdb cockroach sql --insecure -e "CREATE DATABASE IF NOT EXISTS defaultdb"
          for f in schema/002_agent_memory.sql schema/003_agent_audit.sql schema/004_agent_coordination.sql; do
            echo "Applying $f..."
            docker exec -i crdb cockroach sql --insecure -d defaultdb < "$f" 2>&1 || echo "Note: $f had issues (may already exist)"
          done
          echo "Schema setup complete"
      - name: Run real CRDB integration tests
        run: pytest tests/test_crdb_integration.py -v --tb=short
        env:
          BASTION_CONN: "postgresql://root:@localhost:26257/defaultdb?sslmode=disable"
      - name: Cleanup
        if: always()
        run: docker rm -f crdb 2>/dev/null || true
