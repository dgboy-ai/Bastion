name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -e ".[dev,all]" --upgrade pip
      - name: Lint with ruff
        run: ruff check .
        working-directory: src

  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -e ".[dev,all]" pytest-xdist --upgrade pip
      - name: Run tests (parallel)
        run: pytest -xvs --tb=short -n auto
        env:
          BASTION_MOCK: "true"

  dashboard-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: dashboard
      - name: Lint with ESLint
        run: npm run lint
        working-directory: dashboard
      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: dashboard
        continue-on-error: true

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: dashboard
      - name: Lint with ESLint
        run: npm run lint
        working-directory: dashboard
      - name: Build dashboard
        run: npm run build
        working-directory: dashboard

  dashboard-vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: dashboard
      - name: Run vitest
        run: npx vitest run --reporter=verbose
        working-directory: dashboard

  # ── Real CRDB Integration Tests ────────────────────────────────────────
  # This job runs a subset of tests against a real CockroachDB container
  # to prove our SQL queries, vector search, and time-travel actually work.
  crdb-integration:
    runs-on: ubuntu-latest
    services:
      cockroachdb:
        image: cockroachdb/cockroach:v24.2.0
        ports:
          - 26257:26257
        options: >-
          --health-cmd "/cockroach/cockroach node status --insecure --host=localhost:26257 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 15s
        env:
          COCKROACH_DB: defaultdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev,all]" --upgrade pip
      - name: Wait for CockroachDB
        run: |
          echo "Waiting for CockroachDB to be ready..."
          for i in $(seq 1 90); do
            if python -c "
          import psycopg
          conn = psycopg.connect('postgresql://root:@localhost:26257/defaultdb?sslmode=disable', connect_timeout=5)
          conn.close()
          print('Connected!')
          " 2>/dev/null; then
              echo "CockroachDB is ready after ${i}s"
              break
            fi
            echo "Waiting... ($i/90)"
            sleep 2
          done
      - name: Create defaultdb if needed
        run: |
          python -c "
          import psycopg
          conn = psycopg.connect('postgresql://root:@localhost:26257/defaultdb?sslmode=disable')
          conn.autocommit = True
          print('Connected to defaultdb successfully')
          conn.close()
          "
      - name: Apply schema
        run: |
          python -c "
          import psycopg, sys
          conn = psycopg.connect('postgresql://root:@localhost:26257/defaultdb?sslmode=disable')
          conn.autocommit = True
          cur = conn.cursor()
          for schema_file in ['schema/002_agent_memory.sql', 'schema/003_agent_audit.sql', 'schema/004_agent_coordination.sql']:
              try:
                  with open(schema_file) as f:
                      cur.execute(f.read())
                  print(f'Applied {schema_file}')
              except Exception as e:
                  print(f'Skipped {schema_file}: {e}')
                  # Continue with other schemas
          conn.close()
          print('Schema application complete')
          " || echo "Schema application had errors but continuing..."
      - name: Run real CRDB integration tests
        run: pytest tests/test_crdb_integration.py -v --tb=short
        env:
          BASTION_CONN: "postgresql://root:@localhost:26257/defaultdb?sslmode=disable"
