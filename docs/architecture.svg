<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="crdb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6933ff"/>
      <stop offset="100%" stop-color="#4a1fb8"/>
    </linearGradient>
    <linearGradient id="aws" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#e88600"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b8d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Bastion — System Architecture</text>
  <text x="450" y="52" text-anchor="middle" fill="#6b7280" font-size="11">Persistent, Self-Healing Agentic Memory on CockroachDB + AWS</text>

  <!-- Agent Clients Layer -->
  <rect x="30" y="75" width="840" height="90" rx="8" fill="#111827" stroke="#1e3a5f" stroke-width="1"/>
  <text x="50" y="95" fill="#60a5fa" font-size="12" font-weight="600">AGENT CLIENTS</text>
  <g transform="translate(50, 108)">
    <rect width="100" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="50" y="26" text-anchor="middle" fill="#e2e8f0" font-size="10">Claude Desktop</text>
  </g>
  <g transform="translate(165, 108)">
    <rect width="80" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="40" y="26" text-anchor="middle" fill="#e2e8f0" font-size="10">Cursor</text>
  </g>
  <g transform="translate(260, 108)">
    <rect width="90" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="45" y="26" text-anchor="middle" fill="#e2e8f0" font-size="10">LangGraph</text>
  </g>
  <g transform="translate(365, 108)">
    <rect width="80" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="40" y="26" text-anchor="middle" fill="#e2e8f0" font-size="10">CrewAI</text>
  </g>
  <g transform="translate(460, 108)">
    <rect width="80" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="40" y="26" text-anchor="middle" fill="#e2e8f0" font-size="10">Google ADK</text>
  </g>
  <text x="600" y="130" fill="#6b7280" font-size="10">JSON-RPC stdio / Streamable HTTP</text>
  <text x="600" y="145" fill="#6b7280" font-size="10">OAuth 2.1 + PKCE Authentication</text>

  <!-- Arrow down -->
  <line x1="450" y1="165" x2="450" y2="195" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bastion Core Layer -->
  <rect x="30" y="200" width="540" height="180" rx="8" fill="#0f172a" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)"/>
  <text x="50" y="225" fill="#00e5ff" font-size="13" font-weight="700">BASTION CORE</text>

  <!-- MCP Server -->
  <rect x="50" y="240" width="150" height="55" rx="6" fill="#1e293b" stroke="#00e5ff" stroke-width="1"/>
  <text x="125" y="260" text-anchor="middle" fill="#00e5ff" font-size="10" font-weight="600">MCP Server</text>
  <text x="125" y="275" text-anchor="middle" fill="#94a3b8" font-size="8">22 Tools · 4 Resources</text>
  <text x="125" y="287" text-anchor="middle" fill="#94a3b8" font-size="8">FastMCP + stdio/HTTP</text>

  <!-- A2A Server -->
  <rect x="215" y="240" width="140" height="55" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
  <text x="285" y="260" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">A2A Server</text>
  <text x="285" y="275" text-anchor="middle" fill="#94a3b8" font-size="8">Ed25519 · JSON-RPC 2.0</text>
  <text x="285" y="287" text-anchor="middle" fill="#94a3b8" font-size="8">Push Notifications</text>

  <!-- Memory Engine -->
  <rect x="50" y="310" width="305" height="60" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="202" y="330" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">Memory Engine</text>
  <text x="202" y="345" text-anchor="middle" fill="#94a3b8" font-size="8">C-SPANN Vector Search · Cognitive Decay · Hash Chain · MemoryRouter (L1/L2)</text>
  <text x="202" y="358" text-anchor="middle" fill="#94a3b8" font-size="8">Reinforcement · Consolidation · Pinned Memories</text>

  <!-- New Features -->
  <rect x="370" y="240" width="185" height="120" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="462" y="258" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">Agentic Intelligence</text>
  <text x="462" y="278" text-anchor="middle" fill="#e2e8f0" font-size="8">🔄 LTM Gateway</text>
  <text x="462" y="293" text-anchor="middle" fill="#e2e8f0" font-size="8">💤 Dreaming (Sleep-Time)</text>
  <text x="462" y="308" text-anchor="middle" fill="#e2e8f0" font-size="8">⚡ Auto-Contradiction</text>
  <text x="462" y="323" text-anchor="middle" fill="#e2e8f0" font-size="8">🧠 Observations</text>
  <text x="462" y="338" text-anchor="middle" fill="#e2e8f0" font-size="8">🌍 Multi-Region</text>
  <text x="462" y="353" text-anchor="middle" fill="#94a3b8" font-size="7">No competitor has all 5</text>

  <!-- Guards Layer -->
  <rect x="50" y="385" width="505" height="50" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="302" y="405" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="600">Security &amp; Governance</text>
  <text x="302" y="422" text-anchor="middle" fill="#94a3b8" font-size="8">MemoryGuard (OWASP ASI06) · CDC Firewall · Trust Scoring · RLS · Compliance · KMS Encryption</text>

  <!-- CockroachDB Layer -->
  <rect x="600" y="200" width="270" height="240" rx="8" fill="url(#crdb)" stroke="#6933ff" stroke-width="2"/>
  <text x="735" y="225" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">COCKROACHDB</text>
  <text x="735" y="242" text-anchor="middle" fill="#c4b5fd" font-size="9">Distributed SQL · Serializable</text>

  <!-- CRDB Tables -->
  <g transform="translate(620, 260)">
    <rect width="230" height="28" rx="4" fill="#2e1065" stroke="#4c1d95" stroke-width="0.5"/>
    <text x="115" y="18" text-anchor="middle" fill="#e2e8f0" font-size="9">agent_memory (C-SPANN Vector Index)</text>
  </g>
  <g transform="translate(620, 295)">
    <rect width="230" height="28" rx="4" fill="#2e1065" stroke="#4c1d95" stroke-width="0.5"/>
    <text x="115" y="18" text-anchor="middle" fill="#e2e8f0" font-size="9">agent_audit (Hash Chain Ledger)</text>
  </g>
  <g transform="translate(620, 330)">
    <rect width="230" height="28" rx="4" fill="#2e1065" stroke="#4c1d95" stroke-width="0.5"/>
    <text x="115" y="18" text-anchor="middle" fill="#e2e8f0" font-size="9">a2a_tasks (Agent Coordination)</text>
  </g>
  <g transform="translate(620, 365)">
    <rect width="230" height="28" rx="4" fill="#2e1065" stroke="#4c1d95" stroke-width="0.5"/>
    <text x="115" y="18" text-anchor="middle" fill="#e2e8f0" font-size="9">saga_states (Crash-Safe Txns)</text>
  </g>
  <g transform="translate(620, 400)">
    <rect width="230" height="28" rx="4" fill="#2e1065" stroke="#4c1d95" stroke-width="0.5"/>
    <text x="115" y="18" text-anchor="middle" fill="#e2e8f0" font-size="9">agent_entities + agent_relations</text>
  </g>

  <!-- Arrow: Core → CRDB -->
  <line x1="540" y1="330" x2="600" y2="330" stroke="#6933ff" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- AWS Layer -->
  <rect x="30" y="460" width="840" height="120" rx="8" fill="#0f172a" stroke="url(#aws)" stroke-width="1.5"/>
  <text x="50" y="485" fill="#ff9900" font-size="13" font-weight="700">AWS SERVICES</text>

  <!-- AWS Services -->
  <g transform="translate(50, 498)">
    <rect width="110" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="55" y="20" text-anchor="middle" fill="#ff9900" font-size="9" font-weight="600">Bedrock</text>
    <text x="55" y="34" text-anchor="middle" fill="#94a3b8" font-size="7">Titan V2 Embeddings</text>
    <text x="55" y="46" text-anchor="middle" fill="#94a3b8" font-size="7">1024-dim Vectors</text>
    <text x="55" y="58" text-anchor="middle" fill="#94a3b8" font-size="7">Guardrails</text>
  </g>
  <g transform="translate(175, 498)">
    <rect width="110" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="55" y="20" text-anchor="middle" fill="#ff9900" font-size="9" font-weight="600">Lambda</text>
    <text x="55" y="34" text-anchor="middle" fill="#94a3b8" font-size="7">CDC Handler</text>
    <text x="55" y="46" text-anchor="middle" fill="#94a3b8" font-size="7">Hash Chain Verify</text>
    <text x="55" y="58" text-anchor="middle" fill="#94a3b8" font-size="7">Webhook Dispatch</text>
  </g>
  <g transform="translate(300, 498)">
    <rect width="110" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="55" y="20" text-anchor="middle" fill="#ff9900" font-size="9" font-weight="600">KMS</text>
    <text x="55" y="34" text-anchor="middle" fill="#94a3b8" font-size="7">AES-256-GCM</text>
    <text x="55" y="46" text-anchor="middle" fill="#94a3b8" font-size="7">Envelope Encryption</text>
    <text x="55" y="58" text-anchor="middle" fill="#94a3b8" font-size="7">Per-Tenant DEKs</text>
  </g>
  <g transform="translate(425, 498)">
    <rect width="100" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="50" y="20" text-anchor="middle" fill="#ff9900" font-size="9" font-weight="600">S3</text>
    <text x="50" y="34" text-anchor="middle" fill="#94a3b8" font-size="7">Snapshots</text>
    <text x="50" y="46" text-anchor="middle" fill="#94a3b8" font-size="7">Glacier Lifecycle</text>
  </g>
  <g transform="translate(540, 498)">
    <rect width="100" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="50" y="20" text-anchor="middle" fill="#ff9900" font-size="9" font-weight="600">SNS + SQS</text>
    <text x="50" y="34" text-anchor="middle" fill="#94a3b8" font-size="7">Alerts</text>
    <text x="50" y="46" text-anchor="middle" fill="#94a3b8" font-size="7">Retry Queues</text>
    <text x="50" y="58" text-anchor="middle" fill="#94a3b8" font-size="7">DLQ</text>
  </g>
  <g transform="translate(655, 498)">
    <rect width="100" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="50" y="20" text-anchor="middle" fill="#ff9900" font-size="9" font-weight="600">EventBridge</text>
    <text x="50" y="34" text-anchor="middle" fill="#94a3b8" font-size="7">Keep-Alive Rule</text>
    <text x="50" y="46" text-anchor="middle" fill="#94a3b8" font-size="7">Cold Start</text>
    <text x="50" y="58" text-anchor="middle" fill="#94a3b8" font-size="7">Mitigation</text>
  </g>

  <!-- CDC arrow from CRDB to Lambda -->
  <path d="M 735 440 L 735 460 L 175 460 L 175 498" fill="none" stroke="#ff9900" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-orange)"/>
  <text x="450" y="458" text-anchor="middle" fill="#ff9900" font-size="8">CDC Changefeed</text>

  <!-- Legend -->
  <g transform="translate(30, 590)">
    <text fill="#6b7280" font-size="9">Legend:</text>
    <line x1="60" y1="-3" x2="85" y2="-3" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="0" fill="#94a3b8" font-size="8">MCP/A2A Protocol</text>
    <line x1="200" y1="-3" x2="225" y2="-3" stroke="#6933ff" stroke-width="2"/>
    <text x="230" y="0" fill="#94a3b8" font-size="8">SQL Connection</text>
    <line x1="340" y1="-3" x2="365" y2="-3" stroke="#ff9900" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="370" y="0" fill="#94a3b8" font-size="8">CDC Stream</text>
    <rect x="480" y="-8" width="12" height="12" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="497" y="0" fill="#94a3b8" font-size="8">New in this release</text>
  </g>
</svg>
