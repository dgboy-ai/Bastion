# Bastion — Docker Compose Stack (Development)
# One-command local development: docker compose up
#
# This spins up:
# - CockroachDB (single-node, TLS-enabled for local dev)
# - Bastion Dashboard (Next.js at localhost:3000)
# - Pre-seeded demo agent with sample memories
#
# TLS certificates are auto-generated on first run via the certs-init service.
# For production, use CockroachDB Cloud + AWS Lambda (see lambda/template.yaml).

services:
  # ── TLS Certificate Initializer ──────────────────────────────────────────
  certs-init:
    image: cockroachdb/cockroach:v24.3
    volumes:
      - certs:/certs
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/generate-certs.sh"]
    restart: "no"

  # ── CockroachDB ──────────────────────────────────────────────────────────
  cockroachdb:
    image: cockroachdb/cockroach:v24.3
    depends_on:
      certs-init:
        condition: service_completed_successfully
    command: start-single-node --certs-dir=/certs --accept-payloads-for-urls=/
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - certs:/certs:ro
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--certs-dir=/certs", "--host=localhost", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    networks:
      - bastion-net

  # ── Schema Init ──────────────────────────────────────────────────────────
  schema-init:
    image: cockroachdb/cockroach:v24.3
    depends_on:
      cockroachdb:
        condition: service_healthy
    volumes:
      - certs:/certs:ro
      - ./schema:/schemas:ro
    entrypoint: >
      sh -c "
        echo 'Waiting for CockroachDB...'
        for i in \$(seq 1 30); do
          cockroach sql --certs-dir=/certs --host=cockroachdb -e 'SELECT 1' >/dev/null 2>&1 && break
          echo \"  attempt \${i}...\"
          sleep 2
        done
        echo 'Applying schemas...'
        for f in /schemas/0*.sql; do
          echo \"  -> \$(basename \$f)\"
          cockroach sql --certs-dir=/certs --host=cockroachdb -f \"\$f\" 2>&1 || echo \"  (non-critical, continuing)\"
        done
        echo 'Schema applied successfully!'
      "
    networks:
      - bastion-net

  # ── Seed Demo Data ──────────────────────────────────────────────────────
  seed-data:
    image: python:3.12-slim
    depends_on:
      schema-init:
        condition: service_completed_successfully
    volumes:
      - certs:/certs:ro
      - ./scripts:/scripts:ro
      - ./src:/app/src:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    working_dir: /app
    environment:
      - BASTION_CONN=postgresql://root@cockroachdb:26257/defaultdb?sslmode=require&sslrootcert=/certs/ca.crt&sslcert=/certs/client.root.crt&sslkey=/certs/client.root.key
      - BASTION_HMAC_SECRET=bastion-demo-hmac-secret-2026
    entrypoint: >
      sh -c "
        echo 'Installing dependencies...'
        pip install psycopg[binary] pydantic pydantic-settings structlog httpx anyio --quiet 2>/dev/null
        pip install -e /app --quiet 2>/dev/null
        echo 'Seeding demo data...'
        python /scripts/seed_demo.py
        echo 'Seeding complete!'
      "
    networks:
      - bastion-net

  # ── Dashboard ──────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - certs:/certs:ro
    environment:
      - BASTION_CONN=postgresql://root@cockroachdb:26257/defaultdb?sslmode=require&sslrootcert=/certs/ca.crt&sslcert=/certs/client.root.crt&sslkey=/certs/client.root.key
      - BASTION_MOCK=false
      - BASTION_HMAC_SECRET=bastion-demo-hmac-secret-2026
    depends_on:
      cockroachdb:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - bastion-net

  # ── MCP Server (Agent Tool Interface) ────────────────────────────────
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "9997:9997"
    environment:
      - BASTION_CONN=postgresql://root@cockroachdb:26257/defaultdb?sslmode=require&sslrootcert=/certs/ca.crt&sslcert=/certs/client.root.crt&sslkey=/certs/client.root.key
      - BASTION_MOCK=false
      - BASTION_HMAC_SECRET=bastion-demo-hmac-secret-2026
    depends_on:
      cockroachdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9997/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - bastion-net

  # ── TTL Cleanup Worker ──────────────────────────────────────────────
  ttl-cleanup:
    image: python:3.12-slim
    depends_on:
      cockroachdb:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    environment:
      - BASTION_CONN=postgresql://root@cockroachdb:26257/defaultdb?sslmode=require&sslrootcert=/certs/ca.crt&sslcert=/certs/client.root.crt&sslkey=/certs/client.root.key
      - BASTION_HMAC_SECRET=bastion-demo-hmac-secret-2026
      - BASTION_TTL_INTERVAL=300
      - BASTION_AUDIT_RETENTION_DAYS=90
    entrypoint: >
      sh -c "
        pip install psycopg[binary] --quiet 2>/dev/null
        python /scripts/ttl_cleanup.py
      "
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    networks:
      - bastion-net

volumes:
  certs:
  cockroach-data:

networks:
  bastion-net:
    driver: bridge
